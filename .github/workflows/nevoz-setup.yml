name: NEVOZ SETUP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  NEVOZ-SETUP:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. CONFIGURAR USUARIO NEVOZ
      # ==========================================================
      - name: Configurar usuario NEVOZ
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "Nevoz"
          $passwordText = "NvZ-PC-2026!Cloud#82"
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force

          Write-Host ""
          Write-Host "======================================"
          Write-Host "      CONFIGURANDO USUARIO NEVOZ"
          Write-Host "======================================"

          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($user) {
              Write-Host "Usuario Nevoz ja existe."

              try {
                  Set-LocalUser -Name $username -Password $password
                  Write-Host "Senha do usuario atualizada."
              }
              catch {
                  Write-Warning "Nao foi possivel atualizar a senha: $($_.Exception.Message)"
              }
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $password `
                -FullName "Nevoz" `
                -Description "NEVOZ Remote Desktop User" `
                -AccountNeverExpires

              Write-Host "Usuario Nevoz criado."
          }

          # Coloca Nevoz como administrador
          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $isAdmin = Get-LocalGroupMember `
            -Group $adminGroup `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -eq "$env:COMPUTERNAME\$username"
            }

          if (-not $isAdmin) {
              Add-LocalGroupMember `
                -Group $adminGroup `
                -Member $username

              Write-Host "Nevoz adicionado ao grupo Administrators."
          }
          else {
              Write-Host "Nevoz ja e administrador."
          }

          # Garante que a conta esteja habilitada
          Enable-LocalUser -Name $username

          Write-Host ""
          Write-Host "Usuario: Nevoz"
          Write-Host "Administrador: SIM"
          Write-Host "======================================"

      # ==========================================================
      # 2. CONFIGURAR RDP
      # ==========================================================
      - name: Configurar RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          CONFIGURANDO RDP"
          Write-Host "======================================"

          # Ativar RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Exigir NLA
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Liberar firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Garantir que o servico esteja habilitado
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service TermService -Force

          Start-Sleep -Seconds 5

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "RDP nao esta escutando na porta 3389."
          }

          Write-Host "RDP ativo."
          Write-Host "Porta: 3389"

      # ==========================================================
      # 3. CONFIGURAR TAILSCALE
      # ==========================================================
      - name: Instalar e configurar Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        CONFIGURANDO TAILSCALE"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "O secret TAILSCALE_AUTHKEY nao foi configurado."
          }

          winget install `
            --id Tailscale.Tailscale `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "tailscale.exe nao encontrado."
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          & $tailscale up "--authkey=$env:TAILSCALE_AUTHKEY"

          Start-Sleep -Seconds 10

          $status = & $tailscale status

          Write-Host ""
          Write-Host "Tailscale conectado."
          Write-Host $status

      # ==========================================================
      # 4. DETECTAR GPU
      # ==========================================================
      - name: Verificar GPU
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "             GPU CHECK"
          Write-Host "======================================"

          $gpus = Get-CimInstance Win32_VideoController

          if (-not $gpus) {
              Write-Host "Nenhuma GPU detectada."
          }
          else {
              foreach ($gpu in $gpus) {
                  Write-Host ""
                  Write-Host "GPU: $($gpu.Name)"
                  Write-Host "Driver: $($gpu.DriverVersion)"
                  Write-Host "Memoria: $($gpu.AdapterRAM)"
                  Write-Host "Resolucao: $($gpu.CurrentHorizontalResolution)x$($gpu.CurrentVerticalResolution)"
              }
          }

          $nvidia = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue

          if ($nvidia) {
              Write-Host ""
              Write-Host "NVIDIA detectada:"
              nvidia-smi
          }
          else {
              Write-Host ""
              Write-Host "NVIDIA dedicada nao detectada."
          }

      # ==========================================================
      # 5. VERIFICAR USUARIO E ADMINISTRADOR
      # ==========================================================
      - name: Verificar permissao administrativa
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       VERIFICACAO DE ADMIN"
          Write-Host "======================================"

          $user = Get-LocalUser -Name "Nevoz"

          Write-Host "Usuario: $($user.Name)"
          Write-Host "Ativo: $($user.Enabled)"

          $groups = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue

          $found = $groups | Where-Object {
              $_.Name -eq "$env:COMPUTERNAME\Nevoz"
          }

          if ($found) {
              Write-Host "Nevoz e ADMINISTRADOR: SIM"
          }
          else {
              throw "Nevoz nao esta no grupo Administrators."
          }

      # ==========================================================
      # 6. MOSTRAR DADOS DE CONEXAO
      # ==========================================================
      - name: Mostrar dados de conexao
        shell: pwsh
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = & $tailscale ip -4 |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw "Nao foi possivel obter o IP Tailscale."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              NEVOZ SETUP"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "IP/HOST: $ip"
          Write-Host "PORTA: 3389"
          Write-Host "USUARIO: Nevoz"
          Write-Host "ADMINISTRADOR: SIM"
          Write-Host ""
          Write-Host "Use o Windows App no Android."
          Write-Host "O dispositivo Android precisa estar"
          Write-Host "conectado a mesma rede Tailscale."
          Write-Host ""
          Write-Host "=============================================="

      # ==========================================================
      # 7. MANTER O RUNNER ATIVO
      # ==========================================================
      - name: Manter ambiente ativo
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(345)

          Write-Host ""
          Write-Host "======================================"
          Write-Host "      NEVOZ SETUP ESTA ATIVO"
          Write-Host "======================================"

          while ((Get-Date) -lt $deadline) {

              Write-Host ""
              Write-Host "NEVOZ SETUP ativo: $(Get-Date)"

              # Verificar RDP
              $rdp = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $rdp) {
                  Write-Warning "RDP parou. Reiniciando..."

                  Restart-Service TermService -Force

                  Start-Sleep -Seconds 5
              }

              # Verificar Tailscale
              $ts = Get-Service Tailscale `
                -ErrorAction SilentlyContinue

              if ($ts) {
                  if ($ts.Status -ne "Running") {
                      Write-Warning "Tailscale parou. Reiniciando..."

                      Start-Service Tailscale

                      Start-Sleep -Seconds 5
                  }
              }

              # Mostrar novamente o IP
              $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

              if (Test-Path $tailscale) {
                  $ip = & $tailscale ip -4 |
                    Select-Object -First 1

                  Write-Host "IP Tailscale: $ip"
              }

              Write-Host "RDP: OK"
              Write-Host "Tailscale: OK"

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Tempo maximo do runner atingido."
